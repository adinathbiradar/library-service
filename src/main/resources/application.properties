spring.application.name=libraryservice

# Server Port
server.port=8282

# ==========================
# Database Configuration
# ==========================
spring.datasource.url=jdbc:mysql://localhost:3306/interiordatabase
spring.datasource.username=root
spring.datasource.password=Akshara@2023
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ==========================
# JPA & Hibernate
# ==========================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect
spring.jpa.properties.hibernate.format_sql=true

# ==========================
# Spring Security
# ==========================
spring.security.user.name=admin
spring.security.user.password=admin123

# ==========================
# Swagger
# ==========================
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operationsSorter=method
springdoc.swagger-ui.tagsSorter=alpha
springdoc.swagger-ui.enabled=true
springdoc.api-docs.enabled=true
springdoc.show-actuator=true

# ==========================
# Logging
# ==========================
logging.level.org.springdoc=DEBUG
logging.level.org.springframework.web=DEBUG
logging.level.com.example=DEBUG
logging.level.org.springframework.boot.autoconfigure=ERROR

# ==========================
# Eureka Client Configuration
# ==========================
eureka.client.service-url.defaultZone=http://localhost:8761/eureka/

# Register this service with Eureka
eureka.client.register-with-eureka=true

# Fetch registry from Eureka
eureka.client.fetch-registry=true

# Prefer IP address (optional)
eureka.instance.prefer-ip-address=true

# Refresh interval (optional)
eureka.client.registry-fetch-interval-seconds=5